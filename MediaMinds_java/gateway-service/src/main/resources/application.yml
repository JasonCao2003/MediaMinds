server:
  port: 8080
spring:
  application:
    name: gateway-service
# loadbalancer
  cloud:
    loadbalancer:
      configurations: zone-preference
      health-check:
        initial-delay: 2s
        interval: 30s
# gateway
    gateway:
      routes:
        # 用户登录鉴权 9003
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/v1/auth/**
        # Music服务 9005
        - id: music-service
          uri: lb://music-service
          predicates:
            - Path=/v1/music/**
        # Book服务 9006
        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/v1/book/**
        # Video服务 9007
        - id: video-service
          uri: lb://video-service
          predicates:
            - Path=/v1/video/**
        # Agent服务 9011
        - id: agent-service
          uri: lb://agent-service
          predicates:
            - Path=/v1/agent/**
# Eureka
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"